name: build-data

on:
  schedule:
    - cron: '0 13 * 1,2,8,9,10,11,12 2'
    - cron: '0 13 1 3-7 *'
  workflow_dispatch:
    inputs:
      force:
        description: 'Cut a release even if data_version is unchanged'
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: build-data
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v5

      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          packages: any::httr2, any::readr, any::arrow, any::jsonlite, any::nflreadr, any::digest

      - name: Previous manifest
        run: |
          mkdir -p prev
          gh release download latest -p manifest.json -D prev || echo 'no previous release'

      - name: Build
        env:
          OTU_API_KEY: ${{ secrets.OTU_API_KEY }}
          FORCE_RELEASE: ${{ inputs.force == true && 'true' || 'false' }}
        run: Rscript R/build.R

      - name: Decide
        id: decide
        run: echo "needed=$(cat release_needed)" >> "$GITHUB_OUTPUT"

      - name: Publish
        if: steps.decide.outputs.needed == 'true'
        run: |
          day="v$(date -u +%Y.%m.%d)"
          tag="$day"; n=1
          while :; do
            rc=0; git ls-remote --exit-code --tags origin "refs/tags/$tag" >/dev/null || rc=$?
            [ "$rc" -eq 2 ] && break
            [ "$rc" -ne 0 ] && { echo "::error::could not list tags (git exit $rc)"; exit 1; }
            n=$((n + 1)); tag="$day.$n"
          done
          echo "::notice::publishing $tag"
          gh release create "$tag" out/* --title "$tag" --notes "Data release $tag. Contents and checksums in manifest.json. Licence CC-BY-4.0; attribute Off the Upright (offtheupright.com)."
          gh release view latest >/dev/null 2>&1 || gh release create latest --title latest --notes 'Moving release: always the newest data. Cite a dated tag, not this one.'
          gh release upload latest out/* --clobber
